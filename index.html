<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>СамсаНомика · Точка безубыточности</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600;800;900&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;800&display=swap">
<style>
/* ===================== ТОКЕНЫ ===================== */
:root{
  --bg:#040912; --bg2:#08131f; --panel:rgba(12,32,46,.62); --line:rgba(80,240,255,.22);
  --holo:#4ff3ff; --holo2:#9af9ff; --mag:#ff4fd8; --gold:#ffb547; --gold2:#ffd27f;
  --ok:#6bff8f; --bad:#ff4d63; --ink:#e9fbff; --mute:#86a9b8;
  --A:#ff4d63; --B:#3d8bff; --C:#ffb547; --D:#2ee59d;
  --fd:"Unbounded","Arial Black",system-ui,sans-serif; --fb:"Manrope",system-ui,"Segoe UI",sans-serif; --fm:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--fb);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
.mono{font-family:var(--fm)}
.gold{color:var(--gold)} .holo{color:var(--holo)} .mag{color:var(--mag)} .ok{color:var(--ok)} .bad{color:var(--bad)} .mu{color:var(--mute)}
[hidden]{display:none!important}

/* ===================== ХОСТ: СЦЕНА 16:9 ===================== */
#hostWrap{position:fixed;inset:0;overflow:hidden;background:radial-gradient(ellipse at 50% 120%,#0b2a3a 0%,var(--bg) 60%)}
#stage{width:1600px;height:900px;position:absolute;left:50%;top:50%;transform-origin:center;overflow:hidden;background:
  radial-gradient(circle at 20% 10%,rgba(79,243,255,.08),transparent 40%),
  radial-gradient(circle at 85% 90%,rgba(255,79,216,.07),transparent 45%),var(--bg)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:40;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px);mix-blend-mode:overlay}
#grid{position:absolute;inset:0;z-index:0;opacity:.5;pointer-events:none}
#holo3d{position:absolute;z-index:2;pointer-events:none;transition:all 1.1s cubic-bezier(.7,0,.2,1)}
#holo3d.big{left:880px;top:90px;width:680px;height:680px;opacity:1}
#holo3d.corner{left:1400px;top:70px;width:180px;height:180px;opacity:.75}
#holo3d.hide{left:1400px;top:70px;width:180px;height:180px;opacity:0}
.H-top,.H-bot{position:absolute;left:0;right:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:0 40px}
.H-top{top:0;height:62px;font-size:15px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(4,9,18,.85),transparent)}
.H-bot{bottom:0;height:72px;border-top:1px solid var(--line);background:linear-gradient(0deg,rgba(4,9,18,.92),rgba(4,9,18,.4))}
.H-top .brand{font-family:var(--fd);font-weight:800;letter-spacing:.06em;font-size:15px}
.H-top .brand b{color:var(--gold)}
.live{color:var(--ok)} .demo{color:var(--gold)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:currentColor;margin-right:7px;animation:blink 1.2s steps(2) infinite}
.H-bot .left{display:flex;align-items:center;gap:22px;font-family:var(--fm);font-size:15px;color:var(--mute)}
.miniqr{display:flex;align-items:center;gap:10px;cursor:pointer}
.miniqr .q{width:52px;height:52px;background:#fff;padding:3px;border-radius:6px}
.miniqr .q img,.miniqr .q canvas{width:100%!important;height:100%!important}
.ctrl{display:flex;gap:8px;align-items:center}
.ctrl button{height:44px;min-width:44px;border-radius:12px;border:1px solid var(--line);background:rgba(79,243,255,.06);font-size:17px;padding:0 14px}
.ctrl button:hover{border-color:var(--holo);box-shadow:0 0 18px rgba(79,243,255,.35)}
.ctrl .next{background:linear-gradient(135deg,var(--holo),#2bb7ff);color:#001018;font-weight:800;border:0;padding:0 26px}
.prog{position:absolute;left:0;bottom:72px;height:3px;background:linear-gradient(90deg,var(--holo),var(--mag));z-index:31;transition:width .6s}

/* ===================== СЛАЙД ===================== */
.slide{position:absolute;left:0;right:0;top:62px;bottom:72px;z-index:10;padding:46px 80px 30px;display:flex;flex-direction:column}
.slide.enter{animation:holoIn 1s cubic-bezier(.2,.8,.2,1) both}
.slide.enter::after{content:"";position:absolute;left:0;right:0;height:140px;top:-140px;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(79,243,255,.18),rgba(255,255,255,.35),transparent);animation:scanDown 1s ease-out forwards}
@keyframes holoIn{0%{clip-path:inset(0 0 100% 0);filter:brightness(2.4) hue-rotate(40deg) blur(4px)}55%{clip-path:inset(0 0 0 0);filter:brightness(1.4) blur(1px)}62%{transform:translateX(6px) skewX(-2deg)}66%{transform:translateX(-4px)}72%{transform:none}100%{filter:none}}
@keyframes scanDown{to{top:110%}}
.eyebrow{font-family:var(--fm);font-size:17px;letter-spacing:.2em;color:var(--holo);text-transform:uppercase;display:flex;gap:14px;align-items:center}
.eyebrow::before{content:"";width:34px;height:2px;background:var(--holo);box-shadow:0 0 10px var(--holo)}
h1,h2,h3{font-family:var(--fd);margin:0;line-height:1.08;letter-spacing:-.01em;text-wrap:balance}
.t1{font-size:84px;font-weight:900}
.t2{font-size:54px;font-weight:800;margin-top:14px}
.t3{font-size:32px;font-weight:700}
.lead{font-size:27px;line-height:1.45;color:#cfe9f2;max-width:1100px}
.glow{color:var(--holo);text-shadow:0 0 18px rgba(79,243,255,.75),0 0 46px rgba(79,243,255,.35)}
.glowG{color:var(--gold);text-shadow:0 0 18px rgba(255,181,71,.7),0 0 46px rgba(255,181,71,.3)}
.glitch{position:relative;display:inline-block}
.glitch::before,.glitch::after{content:attr(data-t);position:absolute;inset:0;opacity:.7}
.glitch::before{color:var(--mag);transform:translate(3px,0);clip-path:inset(0 0 60% 0);animation:gl1 2.6s infinite steps(1)}
.glitch::after{color:var(--holo);transform:translate(-3px,0);clip-path:inset(55% 0 0 0);animation:gl2 3.1s infinite steps(1)}
@keyframes gl1{0%,92%{transform:translate(0)}93%{transform:translate(5px,-2px)}96%{transform:translate(-4px,1px)}}
@keyframes gl2{0%,88%{transform:translate(0)}90%{transform:translate(-6px,2px)}94%{transform:translate(3px,-1px)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:24px 28px;backdrop-filter:blur(6px);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(120deg,transparent 40%,rgba(79,243,255,.12) 50%,transparent 60%);background-size:250% 100%;animation:sheen 5s linear infinite}
@keyframes sheen{from{background-position:150% 0}to{background-position:-100% 0}}
.row{display:flex;gap:26px} .col{display:flex;flex-direction:column;gap:18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.big{font-family:var(--fd);font-weight:900;font-size:64px;line-height:1}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:8px;font-family:var(--fm);font-size:15px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);color:var(--holo)}
.joke{font-size:24px;color:var(--gold2);border-left:4px solid var(--gold);padding:10px 18px;background:rgba(255,181,71,.07);border-radius:0 14px 14px 0}
.formula{font-family:var(--fd);font-weight:800;font-size:56px;padding:26px 40px;border-radius:24px;border:1.5px solid var(--holo);background:rgba(79,243,255,.06);box-shadow:0 0 40px rgba(79,243,255,.2),inset 0 0 40px rgba(79,243,255,.08);display:inline-flex;align-items:center;gap:22px}
.frac{display:inline-flex;flex-direction:column;align-items:center;font-size:.8em}
.frac span:first-child{border-bottom:4px solid currentColor;padding:0 14px 6px}
.frac span:last-child{padding-top:6px}
/* reveal steps */
[data-s]{opacity:0;transform:translateY(26px) scale(.98);filter:blur(10px);transition:opacity .7s,transform .7s cubic-bezier(.2,.9,.2,1.2),filter .7s}
[data-s].on{opacity:1;transform:none;filter:none}
.pop{animation:popIn .6s cubic-bezier(.2,1.5,.4,1) both}
@keyframes popIn{from{transform:scale(.6);opacity:0}}
@keyframes blink{50%{opacity:.2}}
@keyframes floaty{50%{transform:translateY(-12px)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ===================== ЛОББИ / QR ===================== */
.qrbox{background:#fff;padding:16px;border-radius:22px;box-shadow:0 0 0 2px var(--holo),0 0 60px rgba(79,243,255,.45)}
.qrbox img,.qrbox canvas{display:block}
.room{font-family:var(--fd);font-weight:900;font-size:84px;letter-spacing:.12em}
.bubbles{position:absolute;inset:0;pointer-events:none;z-index:5}
.bub{position:absolute;padding:10px 18px 10px 12px;border-radius:999px;background:rgba(79,243,255,.1);border:1px solid var(--line);font-weight:700;font-size:20px;display:flex;gap:8px;align-items:center;animation:bubIn .9s cubic-bezier(.2,1.6,.4,1) both, floaty 4s ease-in-out infinite;white-space:nowrap}
@keyframes bubIn{from{transform:scale(0) rotate(-20deg);opacity:0}}

/* ===================== ВИКТОРИНА ===================== */
.qopts{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:auto}
.qopt{border-radius:20px;padding:22px 26px;font-size:28px;font-weight:700;display:flex;gap:18px;align-items:center;position:relative;overflow:hidden;min-height:110px;transition:all .5s}
.qopt .L{font-family:var(--fd);font-weight:900;width:58px;height:58px;border-radius:14px;display:grid;place-items:center;background:rgba(0,0,0,.25);flex:none}
.qopt .cnt{margin-left:auto;font-family:var(--fm);font-size:24px}
.qopt .fill{position:absolute;left:0;top:0;bottom:0;background:rgba(255,255,255,.18);width:0;transition:width 1s}
.qA{background:linear-gradient(135deg,#c2253b,var(--A))} .qB{background:linear-gradient(135deg,#1f5fd6,var(--B))} .qC{background:linear-gradient(135deg,#d88a1c,var(--C));color:#2a1600} .qD{background:linear-gradient(135deg,#17a872,var(--D));color:#00241a}
.qopt.dim{opacity:.25;filter:grayscale(.7)}
.qopt.right{box-shadow:0 0 0 4px #fff,0 0 50px rgba(255,255,255,.5);transform:scale(1.03)}
.timer{position:absolute;right:80px;top:40px;width:130px;height:130px}
.timer svg{transform:rotate(-90deg)}
.timer .tv{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fd);font-weight:900;font-size:46px}
.answered{font-family:var(--fm);font-size:20px;color:var(--mute)}
.top5{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px}
.top5 .p{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 16px;font-size:20px;font-weight:700}

/* ===================== ГРАФИК ===================== */
.chart text{font-family:var(--fm);fill:var(--mute);font-size:16px}
.slider{display:grid;grid-template-columns:200px 1fr 170px;gap:16px;align-items:center;font-size:20px}
.slider input{width:100%;accent-color:var(--holo)}
.slider b{font-family:var(--fm);text-align:right}

/* ===================== ИГРА ===================== */
.locs{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.loc{border-radius:22px;padding:22px;border:1px solid var(--line);background:var(--panel)}
.loc .ic{font-size:54px}
.ev{display:flex;gap:16px;align-items:center;padding:9px 16px;border-radius:16px;background:var(--panel);border:1px solid var(--line);font-size:19px;line-height:1.25}
.ev .e{font-size:34px}
.ev .fx{margin-left:auto;font-family:var(--fm);font-size:15px;max-width:230px;white-space:normal;text-align:right;padding:6px 12px;border-radius:10px;background:rgba(0,0,0,.3);white-space:nowrap}
.lb{display:flex;flex-direction:column;gap:8px}
.lbr{display:grid;grid-template-columns:44px 1fr 120px 200px;gap:14px;align-items:center;padding:9px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-size:21px;transition:transform .6s}
.lbr .r{font-family:var(--fd);font-weight:900;color:var(--holo)}
.lbr .v{font-family:var(--fm);text-align:right}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:26px;min-height:200px}
.pod{width:260px;border-radius:22px 22px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:20px;gap:8px;position:relative;animation:rise 1.2s cubic-bezier(.2,.9,.2,1) both}
.pod .nm{font-family:var(--fd);font-weight:800;font-size:24px;text-align:center;padding:0 10px}
.pod .av{font-size:56px}
.pod .pt{font-family:var(--fm);font-size:22px}
.pod .pl{font-family:var(--fd);font-weight:900;font-size:70px;opacity:.35;margin-top:auto;padding-bottom:10px}
@keyframes rise{from{transform:translateY(100%);opacity:0}}
#confetti{position:absolute;inset:0;z-index:35;pointer-events:none}

/* ===================== МОДАЛ QR ===================== */
#bigqr{position:absolute;inset:0;z-index:50;background:rgba(2,6,12,.88);display:grid;place-items:center}

/* ===================== ТЕЛЕФОН ===================== */
#phone{position:fixed;inset:0;overflow-y:auto;padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  background:radial-gradient(circle at 50% -10%,#0d3446,var(--bg) 60%);display:flex;flex-direction:column;gap:16px}
#phone .ph-top{display:flex;justify-content:space-between;align-items:center;font-family:var(--fm);font-size:13px;color:var(--mute)}
#phone h2{font-size:24px} #phone h3{font-size:19px}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:12px}
.pin{width:100%;font:inherit;font-size:18px;color:var(--ink);background:rgba(0,0,0,.35);border:1.5px solid var(--line);border-radius:14px;padding:14px}
.pin:focus{outline:none;border-color:var(--holo)}
.pbtn{width:100%;border:0;border-radius:16px;padding:16px;font-size:18px;font-weight:800;background:linear-gradient(135deg,var(--holo),#2bb7ff);color:#001018}
.pbtn:disabled{opacity:.45}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.avs button{font-size:28px;padding:8px 0;border-radius:12px;border:1.5px solid var(--line);background:rgba(0,0,0,.25)}
.avs button.on{border-color:var(--gold);background:rgba(255,181,71,.15)}
.pq{display:grid;grid-template-columns:1fr;gap:12px}
.pq button{border:0;border-radius:18px;padding:20px 16px;font-size:18px;font-weight:800;text-align:left;display:flex;gap:12px;align-items:center;min-height:74px}
.pq button .L{font-family:var(--fd);font-size:20px;width:40px;height:40px;border-radius:10px;background:rgba(0,0,0,.25);display:grid;place-items:center;flex:none}
.pbar{height:8px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--holo),var(--mag));transition:width .25s linear}
.pstat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pstat div{background:rgba(0,0,0,.25);border-radius:14px;padding:12px}
.pstat small{display:block;color:var(--mute);font-size:12px;font-family:var(--fm)}
.pstat b{font-family:var(--fm);font-size:18px}
.ploc{display:grid;gap:10px}
.ploc button{display:flex;gap:12px;align-items:center;text-align:left;border-radius:16px;border:1.5px solid var(--line);background:rgba(0,0,0,.25);padding:12px 14px}
.ploc button.on{border-color:var(--gold);background:rgba(255,181,71,.12)}
.ploc .ic{font-size:30px}
.ploc small{display:block;color:var(--mute);font-family:var(--fm);font-size:12px}
.bigemoji{font-size:74px;text-align:center;animation:floaty 3s ease-in-out infinite}
.center{text-align:center}

/* ===================== ЛЕНДИНГ ===================== */
#landing{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0%,#0d3446,var(--bg) 65%)}
#landing .box{width:min(560px,100%);display:flex;flex-direction:column;gap:16px;text-align:center}
#landing h1{font-size:clamp(30px,7vw,52px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- ===== ЛЕНДИНГ ===== -->
<div id="landing" hidden>
  <div class="box">
    <div class="mono holo" style="letter-spacing:.2em">ОСНОВЫ БИЗНЕСА · ТЕМА 14</div>
    <h1 class="glow">СамсаНомика</h1>
    <p class="mu" style="font-size:18px">Себестоимость и точка безубыточности — живая презентация с игрой</p>
    <button class="pbtn" id="lHost">🎤 Я ведущий — запустить презентацию</button>
    <div class="pcard"><input class="pin" id="lRoom" inputmode="numeric" maxlength="4" placeholder="Код комнаты (4 цифры)"><button class="pbtn" id="lJoin">📱 Войти как участник</button></div>
  </div>
</div>

<!-- ===== ХОСТ ===== -->
<div id="hostWrap" hidden>
  <div id="stage">
    <canvas id="grid"></canvas>
    <canvas id="holo3d" class="big"></canvas>
    <div class="H-top"><div class="brand">САМСА<b>НОМИКА</b> · <span class="mu" id="hInst"></span></div><div class="mono mu" id="hMeta"></div></div>
    <div id="slideHost"></div>
    <div class="bubbles" id="bubbles"></div>
    <canvas id="confetti"></canvas>
    <div class="prog" id="prog"></div>
    <div class="H-bot">
      <div class="left"><span class="miniqr" id="miniqr" title="Q — большой QR"><span class="q" id="mqr"></span><span>ВХОД · <b class="gold" id="mroom"></b></span></span><span>👥 <b id="pcount">0</b></span><span id="netst"></span></div>
      <div class="ctrl">
        <button id="bBots" title="Добавить ботов для репетиции">🤖+10</button>
        <button id="bPrev" title="Назад (←)">◀</button>
        <button class="next" id="bNext">Далее ▶</button>
        <button id="bMute" title="Звук (M)">🔊</button>
        <button id="bFS" title="Полный экран (F)">⛶</button>
        <button id="bReset" title="Сбросить всё">↺</button>
      </div>
    </div>
    <div id="bigqr" hidden></div>
  </div>
</div>

<!-- ===== ТЕЛЕФОН ===== -->
<div id="phone" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================================
   0) НАСТРОЙКИ — поменяйте под себя
   ========================================================================= */
const CFG = {
  AUTHOR:  "Ашурали Нуралиев",              // докладчик
  GROUP:   "Группа ____",                    // группа
  TEACHER: "Преподаватель: ____________",    // преподаватель
  INST:    "TIIAME",                          // институт
  QUIZ_SEC: 20,                               // секунд на вопрос
  GAME_SEC: 90                                // секунд на решение в игре
};
/* Брокеры для синхронизации экрана и телефонов (бесплатные, без регистрации) */
const BROKERS = ["wss://broker.emqx.io:8084/mqtt","wss://broker.hivemq.com:8884/mqtt"];

/* =========================================================================
   1) УТИЛИТЫ
   ========================================================================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt = n => Math.round(n).toLocaleString("ru-RU").replace(/,/g," ");
const mln = n => (n/1e6).toLocaleString("ru-RU",{maximumFractionDigits:1}) + " млн";
const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
const hash = s => { let h=2166136261; for (const c of String(s)) { h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; };
const qs = new URLSearchParams(location.search);
const IS_HOST = qs.get("host") === "1";
let ROOM = (qs.get("room")||"").replace(/\D/g,"").slice(0,4);

/* =========================================================================
   2) СЕТЬ — MQTT (публичный брокер) или BroadcastChannel (локальная репетиция)
   ========================================================================= */
const NET = {
  mode:"", ok:false, retained:{}, subs:[], client:null, bc:null, prefix:"",
  on(re, fn){ this.subs.push({re, fn}); for (const t in this.retained) if (re.test(t)) fn(t, this.retained[t]); },
  _deliver(t, data){ if (data === null) delete this.retained[t]; else this.retained[t] = data; for (const s of this.subs) if (s.re.test(t)) s.fn(t, data); },
  pub(t, data, retain=true){
    if (this.mode === "mqtt" && this.client) this.client.publish(this.prefix+t, data===null ? "" : JSON.stringify(data), {retain, qos:0});
    else if (this.bc) { this.bc.postMessage({k:"m", t, data, retain}); this._deliver(t, data); }
    if (this.mode === "mqtt" && !this.client.connected) this._deliver(t, data);
  },
  start(onStatus){
    this.prefix = "samsanomika/v2/" + ROOM + "/";
    const force = qs.get("t");
    if (force !== "bc" && window.mqtt) {
      this.mode = "mqtt"; let bi = 0;
      const connect = () => {
        const url = BROKERS[bi % BROKERS.length];
        const c = mqtt.connect(url, {clientId:"sn_"+Math.random().toString(16).slice(2,10), clean:true, reconnectPeriod:2500, connectTimeout:6000, keepalive:30});
        this.client = c; let opened = false;
        c.on("connect", () => { opened = true; this.ok = true; onStatus && onStatus("live"); c.subscribe(this.prefix+"#", {qos:0}); });
        c.on("message", (topic, buf) => { const t = topic.slice(this.prefix.length); const s = buf.toString(); let d=null; if (s) { try{ d=JSON.parse(s); }catch(_){ return; } } this._deliver(t, d); });
        c.on("close", () => { this.ok = false; onStatus && onStatus("off"); });
        c.on("error", () => {});
        setTimeout(() => { if (!opened) { try{ c.end(true); }catch(_){} bi++; connect(); } }, 7000);
      };
      connect();
    } else {
      this.mode = "bc"; this.ok = true; onStatus && onStatus("local");
      this.bc = new BroadcastChannel("samsanomika-"+ROOM);
      this.bc.onmessage = e => {
        const m = e.data;
        if (m.k === "m") this._deliver(m.t, m.data);
        else if (m.k === "sync") for (const t in this.retained) this.bc.postMessage({k:"m", t, data:this.retained[t], retain:true});
      };
      this.bc.postMessage({k:"sync"});
    }
  }
};

/* =========================================================================

   ========================================================================= */
const SND = {
  ctx:null, muted:false,
  init(){ if (!this.ctx) { try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(_){} } if (this.ctx && this.ctx.state==="suspended") this.ctx.resume(); },
  tone(f, d=.15, type="sine", v=.12, when=0, slide=0){
    if (this.muted || !this.ctx) return; const t=this.ctx.currentTime+when;
    const o=this.ctx.createOscillator(), g=this.ctx.createGain(); o.type=type; o.frequency.setValueAtTime(f,t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t+d);
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g).connect(this.ctx.destination); o.start(t); o.stop(t+d+.05);
  },
  noise(d=.4, v=.08, f1=300, f2=3000){
    if (this.muted || !this.ctx) return; const t=this.ctx.currentTime, n=this.ctx.sampleRate*d, b=this.ctx.createBuffer(1,n,this.ctx.sampleRate), a=b.getChannelData(0);
    for (let i=0;i<n;i++) a[i]=Math.random()*2-1;
    const s=this.ctx.createBufferSource(); s.buffer=b; const bp=this.ctx.createBiquadFilter(); bp.type="bandpass"; bp.Q.value=1.2;
    bp.frequency.setValueAtTime(f1,t); bp.frequency.exponentialRampToValueAtTime(f2,t+d);
    const g=this.ctx.createGain(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(bp).connect(g).connect(this.ctx.destination); s.start(t);
  },
  whoosh(){ this.noise(.45,.09,200,4200); this.tone(180,.35,"sine",.05,0,900); },
  step(){ this.tone(660,.08,"triangle",.07); this.tone(990,.1,"triangle",.05,.06); },
  join(){ this.tone(523,.1,"sine",.09); this.tone(784,.14,"sine",.08,.08); },
  tick(){ this.tone(1200,.04,"square",.035); },
  right(){ [523,659,784,1046].forEach((f,i)=>this.tone(f,.22,"triangle",.08,i*.09)); },
  boom(){ this.tone(110,.6,"sawtooth",.09,0,40); this.noise(.5,.06,1200,120); },
  fanfare(){ [392,523,659,784,659,784,1046].forEach((f,i)=>this.tone(f,.28,"square",.05,i*.12)); this.noise(1.2,.03,400,5000); },
  coin(){ this.tone(988,.07,"square",.05); this.tone(1319,.18,"square",.05,.07); },
  intro(){ [130.8,196,261.6,392].forEach((f,i)=>this.tone(f,2.2,"sine",.06,i*.35)); this.noise(2,.03,100,3000); }
};

function gameCalc(ch, nEv, pid){
  if (!ch || !LOCS[ch.loc]) return null;
  const L = LOCS[ch.loc], P = clamp(+ch.price||8000, 5000, 15000);
  let vc = VC0, fc = L.fc, tr = L.tr, fine = 0;
  if (nEv >= 1) vc += 1000;
  if (nEv >= 2 && P <= 9000) tr *= 1.5;
  if (nEv >= 3 && ch.loc === "mall") fc += 12e6;
  if (nEv >= 4 && ch.loc === "metro") tr *= .7;
  if (nEv >= 5 && ch.loc === "mahalla") tr += 80;
  if (nEv >= 6 && hash(pid+"ses") % 3 === 0) fine = 3e6;
  const daily = Math.min(CAP, tr * Math.max(0, (16000 - P) / 8000));
  const q = Math.round(daily * DAYS);
  const profit = q * (P - vc) - fc - fine;
  const bep = P > vc ? Math.ceil(fc / (P - vc)) : Infinity;
  return {P, vc, fc, q, daily, profit, bep, fine, loc:ch.loc};
}
function bestPrice(loc, nEv){
  let best = {p:0, pr:-1e18};
  for (let p = 5000; p <= 15000; p += 500) { const r = gameCalc({loc, price:p}, nEv, "x1"); if (r.profit + r.fine > best.pr) best = {p, pr:r.profit + r.fine}; }
  return best;
}

let S = {slide:0, step:0, sub:"", t0:0, lock:false, v:0};   // публикуется в "st"
let PL = {}, ANS = {}, GAME = {}, POLLV = {}, BOTS = {};      // игроки, ответы, решения, голоса

const hk = () => "sn-host-" + ROOM;
function saveHost(){ store.set(hk(), {S, PL, ANS, GAME, POLLV, BOTS}); }
function pubState(){ S.v = Date.now(); NET.pub("st", S); saveHost(); }
function players(){ return Object.entries(PL).map(([id,p]) => ({id, ...p})); }

function quizScore(key){
  const q = QUIZ[key], out = {}; const A = ANS[key] || {};
  for (const [pid, a] of Object.entries(A)) {
    const ok = a.c === q.a; const left = clamp(1 - a.ms/(CFG.QUIZ_SEC*1000), 0, 1);
    out[pid] = {ok, pts: ok ? Math.round(500 + 500*left) : 0, c:a.c};
  }
  return out;
}
function totals(){
  const T = {};
  for (const p of players()) T[p.id] = {quiz:0, game:0};
  for (const key of Object.keys(QUIZ)) {
    const si = SLIDES.findIndex(s => s.quiz === key);
    const revealed = S.slide > si || (S.slide === si && S.sub === "r");
    if (!revealed) continue;
    const sc = quizScore(key); for (const pid in sc) if (T[pid]) T[pid].quiz += sc[pid].pts;
  }
  const gi = SLIDES.findIndex(s => s.id === "gresults");
  if (S.slide >= gi) for (const pid in T) { const r = gameCalc(GAME[pid], 6, pid); if (r) T[pid].game = Math.max(0, Math.round(r.profit / 20000)); }
  for (const pid in T) T[pid].total = T[pid].quiz + T[pid].game;
  return T;
}
function gameStep(){ const ei = SLIDES.findIndex(s=>s.id==="gevents"); if (S.slide < ei) return 0; if (S.slide === ei) return S.step; return 6; }
function gameRanking(nEv){
  return players().map(p => ({...p, r: gameCalc(GAME[p.id], nEv, p.id)})).filter(x => x.r).sort((a,b) => b.r.profit - a.r.profit);
}
/* результаты для телефонов */
function pubResults(){
  const T = totals(); const ranked = Object.entries(T).sort((a,b)=>b[1].total-a[1].total);
  const n = gameStep(); const gr = gameRanking(n); const res = {};
  ranked.forEach(([pid,t],i) => { res[pid] = {score:t.total, rank:i+1, n:ranked.length}; });
  const cs = SLIDES[S.slide];
  if (cs.quiz && S.sub === "r") { const sc = quizScore(cs.quiz); for (const pid in res) res[pid].last = sc[pid] || {ok:false, pts:0, c:-1}; }
  gr.forEach((x,i) => { if (res[x.id]) res[x.id].game = {profit:x.r.profit, rank:i+1, n:gr.length, bep:x.r.bep, q:x.r.q, loc:x.r.loc, P:x.r.P, fine:x.r.fine}; });
  NET.pub("res", res);
}

/* --- универсальный график безубыточности (SVG) --- */
function bepChart(P, VC, FC, opt={}){
  const W = opt.w||900, H = opt.h||470, pad = {l:110,r:30,t:24,b:56};
  const bep = P>VC ? FC/(P-VC) : Infinity;
  const qMax = opt.qMax || Math.max(6000, Math.ceil((isFinite(bep)?bep*1.9:6000)/1000)*1000);
  const yMax = Math.max(P*qMax, FC+VC*qMax) * 1.05;
  const x = q => pad.l + (q/qMax)*(W-pad.l-pad.r), y = v => H-pad.b - (v/yMax)*(H-pad.t-pad.b);
  let grid = ""; for (let i=0;i<=5;i++){ const q=qMax*i/5, v=yMax*i/5;
    grid += `<line x1="${x(q)}" y1="${pad.t}" x2="${x(q)}" y2="${H-pad.b}" stroke="rgba(79,243,255,.08)"/><text x="${x(q)}" y="${H-pad.b+28}" text-anchor="middle">${fmt(q)}</text>`;
    grid += `<line x1="${pad.l}" y1="${y(v)}" x2="${W-pad.r}" y2="${y(v)}" stroke="rgba(79,243,255,.08)"/><text x="${pad.l-12}" y="${y(v)+5}" text-anchor="end">${(v/1e6).toFixed(0)} млн</text>`; }
  const bx = isFinite(bep)&&bep<=qMax ? x(bep) : null, by = bx ? y(P*bep) : null;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
    <defs><linearGradient id="gL" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ff4d63" stop-opacity=".35"/><stop offset="1" stop-color="#ff4d63" stop-opacity="0"/></linearGradient>
    <linearGradient id="gP" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#6bff8f" stop-opacity=".35"/><stop offset="1" stop-color="#6bff8f" stop-opacity="0"/></linearGradient></defs>
    ${grid}
    ${bx?`<polygon points="${x(0)},${y(FC)} ${bx},${by} ${x(0)},${y(0)}" fill="url(#gL)"/><polygon points="${bx},${by} ${x(qMax)},${y(P*qMax)} ${x(qMax)},${y(FC+VC*qMax)}" fill="url(#gP)"/>`:""}
    <line x1="${x(0)}" y1="${y(FC)}" x2="${x(qMax)}" y2="${y(FC)}" stroke="#ff4fd8" stroke-width="3" stroke-dasharray="10 8"/>
    <line x1="${x(0)}" y1="${y(FC)}" x2="${x(qMax)}" y2="${y(FC+VC*qMax)}" stroke="#ff4d63" stroke-width="5" class="draw"/>
    <line x1="${x(0)}" y1="${y(0)}" x2="${x(qMax)}" y2="${y(P*qMax)}" stroke="#4ff3ff" stroke-width="5" class="draw" style="filter:drop-shadow(0 0 8px #4ff3ff)"/>
    ${bx?`<line x1="${bx}" y1="${by}" x2="${bx}" y2="${H-pad.b}" stroke="#ffb547" stroke-width="2" stroke-dasharray="6 6"/>
      <circle cx="${bx}" cy="${by}" r="14" fill="#ffb547"><animate attributeName="r" values="12;20;12" dur="1.6s" repeatCount="indefinite"/></circle>
      <circle cx="${bx}" cy="${by}" r="30" fill="none" stroke="#ffb547" stroke-width="2"><animate attributeName="r" values="14;46" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite"/></circle>

function stepApply(){
  document.querySelectorAll("#slideHost [data-s]").forEach(el => el.classList.toggle("on", +el.dataset.s <= S.step));
}
function renderHost(force){
  const s = SLIDES[S.slide];
  if (force || lastRendered !== S.slide) {
    const html = s.quiz ? renderQuiz(s) : R[s.id]();
    $("#slideHost").innerHTML = `<div class="slide enter">${html}</div>`;
    lastRendered = S.slide; SND.whoosh(); $("#bubbles").hidden = s.id !== "open";
    holoMode(s.holo || "hide");
    afterRender(s);
  }
  stepApply(); liveUpdate();
  $("#hMeta").innerHTML = `${String(S.slide+1).padStart(2,"0")} / ${SLIDES.length} · ${esc(s.nm)} · ${NET.mode==="mqtt" ? (NET.ok?'<span class="live"><span class="dot"></span>LIVE</span>':'<span class="demo">подключение…</span>') : '<span class="demo">ЛОКАЛЬНО</span>'}`;
  $("#prog").style.width = ((S.slide+1)/SLIDES.length*100)+"%";
  const nb = $("#bNext");
  nb.textContent = s.quiz ? (S.sub==="" ? "Запустить вопрос ▶" : S.sub==="q" ? "Показать ответ ▶" : "Далее ▶") : (S.slide===SLIDES.length-1 && S.step>=s.steps ? "Конец" : "Далее ▶");
}
function afterRender(s){
  if (s.id === "open") { drawQR($("#bigqrSlot"), 230); }
  if (s.id === "chart") bindChart();
  if (s.id === "cm") startBarrel();
}
function liveUpdate(){
  const s = SLIDES[S.slide];
  $("#pcount").textContent = Object.keys(PL).length;
  if (s.id === "open") { const c=$("#cntBig"); if (c) c.textContent = Object.keys(PL).length; }
  if (s.id === "story" && S.step >= 3) { const el=$("#lossCnt"); if (el && !el.dataset.done) { el.dataset.done=1; countTo(el, -36e6, 1600, v => fmt(v)+" сум"); SND.boom(); $("#bakh").innerHTML = bakhtiyar(300,"sad"); } }
  if (s.id === "poll") updPoll();
  if (s.quiz) updQuiz(s);
  if (s.id === "whatif") updWhatIf();
  if (s.id === "gsetup") updGSetup();
  if (s.id === "gevents") updGEvents();
  if (s.id === "gresults") updGResults();
  if (s.id === "insight") updInsight();
  if (s.id === "final") updFinal();
}
function countTo(el, to, ms, f){ const t0=performance.now(); (function k(t){ const p=clamp((t-t0)/ms,0,1), e=1-Math.pow(1-p,3); el.textContent=f(to*e); if(p<1) requestAnimationFrame(k); })(t0); }

function updPoll(){

  const c = POLL.o.map(()=>0); Object.values(POLLV).forEach(v => { if (c[v] != null) c[v]++; });

  if (!box.children.length) box.innerHTML = POLL.o.map((o,i)=>`<div class="row" style="align-items:center;gap:16px;font-size:24px"><span style="width:420px">${o}</span><span style="flex:1;height:44px;border-radius:12px;background:rgba(255,255,255,.05);overflow:hidden"><i data-b="${i}" style="display:block;height:100%;width:0;background:linear-gradient(90deg,var(--holo),var(--mag));box-shadow:0 0 18px rgba(79,243,255,.5);transition:width .8s cubic-bezier(.2,1.3,.4,1)"></i></span><b class="num" data-c="${i}" style="width:110px;text-align:right">0</b></div>`).join("");

  return `${eb(`Вопрос ${n} из 5 · отвечайте с телефона`)}

function updQuiz(s){
  const q = QUIZ[s.quiz], A = ANS[s.quiz]||{}; const n = Object.keys(A).length, np = Object.keys(PL).length;
  const ans = $("#qAns"); if (!ans) return;
  const opts = [...document.querySelectorAll("#qOpts .qopt")];
  if (S.sub === "") { ans.textContent = "Приготовьтесь… ведущий запустит таймер"; opts.forEach(o=>o.style.opacity=.35); $("#qTimer").innerHTML=""; return; }
  opts.forEach(o=>o.style.opacity="");
  ans.textContent = `Ответили: ${n} из ${np}`;
  if (S.sub === "q") return;
  // результат
  const cnt = q.o.map(()=>0); Object.values(A).forEach(a => { if (cnt[a.c]!=null) cnt[a.c]++; }); const mx = Math.max(...cnt,1);
  opts.forEach((o,i)=>{ o.classList.toggle("right", i===q.a); o.classList.toggle("dim", i!==q.a); o.querySelector(".cnt").textContent = cnt[i]; o.querySelector(".fill").style.width = (cnt[i]/mx*100)+"%"; });
  $("#qTimer").innerHTML = "";
  const sc = quizScore(s.quiz); const top = Object.entries(sc).filter(x=>x[1].ok).sort((a,b)=>b[1].pts-a[1].pts).slice(0,5);
  $("#qExp").innerHTML = `<div class="joke" style="font-size:22px">✅ ${q.x}</div>${top.length?`<div class="top5">${top.map(([pid,v],i)=>`<span class="p">${i===0?"⚡":""}${PL[pid]?.av||""} ${esc(PL[pid]?.n||"?")} <span class="gold num">+${v.pts}</span></span>`).join("")}</div>`:""}`;
}
function ring(el, left, total){
  if (!el) return; const r=56, c=2*Math.PI*r, p=clamp(left/total,0,1);
  el.innerHTML = `<svg width="130" height="130"><circle cx="65" cy="65" r="${r}" stroke="rgba(255,255,255,.1)" stroke-width="10" fill="none"/><circle cx="65" cy="65" r="${r}" stroke="${p<.3?'#ff4d63':'#4ff3ff'}" stroke-width="10" fill="none" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}" stroke-linecap="round" style="transition:stroke-dashoffset .25s linear"/></svg><div class="tv">${Math.ceil(left)}</div>`;
}
function startQuizClock(){
  clearInterval(quizTimer); let lastSec = -1;
  quizTimer = setInterval(() => {
    const s = SLIDES[S.slide]; if (!s.quiz || S.sub !== "q") { clearInterval(quizTimer); return; }
    const left = CFG.QUIZ_SEC - (Date.now()-S.t0)/1000;
    ring($("#qTimer"), left, CFG.QUIZ_SEC);
    const sec = Math.ceil(left); if (sec !== lastSec && sec <= 5 && sec > 0) SND.tick(); lastSec = sec;

    if (S.sub === "q") { S.sub = "r"; pubState(); renderHost(); pubResults(); SND.right(); return; }
  }
  if (s.id === "gsetup" && !S.lock) { S.lock = true; pubState(); renderHost(); SND.boom(); return; }
  if (S.step < (s.steps||0)) { S.step++; pubState(); renderHost(); SND.step(); if (s.id==="gevents") { const e = EVENTS[S.step-1]; e && (e.bad ? SND.boom() : SND.coin()); pubResults(); } return; }
  if (S.slide < SLIDES.length-1) go(S.slide+1);
}
function hostPrev(){
  const s = SLIDES[S.slide];

}
function go(i, back){
  S.slide = i; S.step = back ? (SLIDES[i].steps||0) : 0; S.sub = ""; S.lock = false; S.t0 = Date.now();
  const s = SLIDES[i];
  if (s.quiz && back) S.sub = "r";

  pubState(); renderHost(); pubResults();
}

/* --- голограмма (three.js) --- */
let HOLO = null;
function holoInit(){
  const cv = $("#holo3d"); if (!window.THREE) { cv.style.display="none"; return; }
  const r = new THREE.WebGLRenderer({canvas:cv, alpha:true, antialias:true}); r.setPixelRatio(Math.min(devicePixelRatio,2)); r.setSize(680,680,false);
  const sc = new THREE.Scene(), cam = new THREE.PerspectiveCamera(40,1,.1,100); cam.position.set(0,1.2,7); cam.lookAt(0,.2,0);
  const g = new THREE.Group(); sc.add(g);
  // самса: треугольная «пирамидка»
  const geo = new THREE.ConeGeometry(1.7, 1.1, 3, 4); geo.rotateX(Math.PI/2); geo.scale(1,1,.55); geo.rotateX(-Math.PI/2);
  const shape = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color:0xffb547, wireframe:true, transparent:true, opacity:.55}));
  const edges = new THREE.LineSegments(new THREE.EdgesGeometry(geo), new THREE.LineBasicMaterial({color:0xffe2a8}));
  const inner = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({color:0xffb547, transparent:true, opacity:.12}));
  g.add(shape, edges, inner);
  // орбиты
  const rings = [];
  for (let i=0;i<3;i++){ const t = new THREE.Mesh(new THREE.TorusGeometry(2.2+i*.35, .008, 6, 120), new THREE.MeshBasicMaterial({color: i===1?0xff4fd8:0x4ff3ff, transparent:true, opacity:.6})); t.rotation.x = Math.PI/2 + (i-1)*.35; t.rotation.y = i*.6; sc.add(t); rings.push(t); }
  // частицы
  const pg = new THREE.BufferGeometry(), N = 600, pos = new Float32Array(N*3);
  for (let i=0;i<N;i++){ const a=Math.random()*6.28, rr=1.2+Math.random()*2.6; pos[i*3]=Math.cos(a)*rr; pos[i*3+1]=(Math.random()-.5)*3.2; pos[i*3+2]=Math.sin(a)*rr; }
  pg.setAttribute("position", new THREE.BufferAttribute(pos,3));
  const pts = new THREE.Points(pg, new THREE.PointsMaterial({color:0x4ff3ff, size:.03, transparent:true, opacity:.8})); sc.add(pts);
  // луч проектора
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(.15, 2.4, 3.6, 40, 1, true), new THREE.MeshBasicMaterial({color:0x4ff3ff, transparent:true, opacity:.07, side:THREE.DoubleSide}));
  beam.position.y = -.4; sc.add(beam);
  const base = new THREE.Mesh(new THREE.TorusGeometry(.6,.05,8,60), new THREE.MeshBasicMaterial({color:0x4ff3ff})); base.rotation.x = Math.PI/2; base.position.y = -2.2; sc.add(base);
  const clock = new THREE.Clock();
  (function loop(){
    const t = clock.getElapsedTime();
    g.rotation.y = t*.6; g.rotation.x = Math.sin(t*.7)*.15; g.position.y = .3 + Math.sin(t*1.3)*.12;
    shape.material.opacity = .45 + Math.sin(t*9)*.08 + (Math.random()<.02 ? -.3 : 0);
    rings.forEach((rg,i)=> rg.rotation.z = t*(.2+i*.15)*(i%2?-1:1));
    pts.rotation.y = -t*.12; beam.material.opacity = .05 + Math.sin(t*3)*.02;
    r.render(sc, cam); requestAnimationFrame(loop);
  })();
  HOLO = r;
}

    const hz = 560; for (let i=-20;i<=20;i++){ c.beginPath(); c.moveTo(800+i*40, hz); c.lineTo(800+i*260, 900); c.stroke(); }

  $("#bMute").onclick = () => { SND.muted = !SND.muted; $("#bMute").textContent = SND.muted ? "🔇" : "🔊"; };
  $("#bFS").onclick = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); };
  $("#bReset").onclick = e => hostReset(e.currentTarget); $("#miniqr").onclick = () => bigQR(); $("#bigqr").onclick = () => bigQR(false);
  addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    if (["ArrowRight","PageDown"," ","Enter"].includes(e.key)) { e.preventDefault(); hostNext(); }
    else if (["ArrowLeft","PageUp"].includes(e.key)) { e.preventDefault(); hostPrev(); }
    else if (e.key==="q"||e.key==="Q"||e.key==="й") bigQR();
    else if (e.key==="m"||e.key==="ь") $("#bMute").click();
    else if (e.key==="f"||e.key==="а") $("#bFS").click();
  });
  addEventListener("pointerdown", () => { const first = !SND.ctx; SND.init(); if (first && S.slide===0) SND.intro(); }, {once:false});
  renderHost(true);
  if (SLIDES[S.slide].quiz && S.sub === "q") startQuizClock();
  setInterval(() => { if (NET.ok) NET.pub("st", S); }, 15000);   // подстраховка
  if (S.slide===0) Object.keys(PL).forEach(bubble);
}

/* =========================================================================
   10) ТЕЛЕФОН УЧАСТНИКА
   ========================================================================= */
const ME = { id:"", n:"", av:"", st:null, res:{}, sent:{}, gameLocal:null, qSeen:{} };
function pk(){ return "sn-me-" + ROOM + (qs.get("tab")||""); }
function startPhone(){
  $("#phone").hidden = false;
  const saved = store.get(pk(), null);
  if (saved && saved.id) Object.assign(ME, saved); else ME.id = "u" + Math.random().toString(36).slice(2,10);
  ME.sent = ME.sent || {};
  NET.start(st => { ME.net = st; drawPhone(); if (st === "live" && ME.n) NET.pub("p/"+ME.id, {n:ME.n, av:ME.av}); });
  NET.on(/^st$/, (t,d) => { if (!d) return; const prev = ME.st; ME.st = d;
    const s = SLIDES[d.slide]; if (s && s.quiz && d.sub === "q" && !ME.qSeen[s.quiz+d.t0]) ME.qSeen[s.quiz+d.t0] = Date.now();
    if (s && s.id === "gsetup" && !ME.qSeen["g"+d.t0]) ME.qSeen["g"+d.t0] = Date.now() - clamp(Date.now()-d.t0, 0, 3000);
    if (!prev || prev.slide !== d.slide || prev.sub !== d.sub || prev.lock !== d.lock || prev.step !== d.step) { navigator.vibrate?.(30); drawPhone(); } });
  NET.on(/^res$/, (t,d) => { ME.res = (d && d[ME.id]) || {}; drawPhone(); });
  setInterval(() => { const s = ME.st && SLIDES[ME.st.slide]; if (s && ((s.quiz && ME.st.sub==="q") || s.id==="gsetup")) tickPhone(); }, 250);
  drawPhone();
}
function saveMe(){ store.set(pk(), {id:ME.id, n:ME.n, av:ME.av, sent:ME.sent, gameLocal:ME.gameLocal}); }
function phTop(){ return `<div class="ph-top"><span>САМСА<b class="gold">НОМИКА</b> · ${ROOM}</span><span>${ME.net==="live"?'<span class="ok">● онлайн</span>':ME.net==="local"?'<span class="gold">● локально</span>':'<span class="bad">● подключение…</span>'}</span></div>`; }
function drawPhone(){
  const P = $("#phone");
  if (!ME.n) {
    const av = ME.av || AVATARS[0];
    P.innerHTML = `${phTop()}<div class="bigemoji">🥟</div><h2 class="center glow">Добро пожаловать!</h2>
     <div class="pcard"><label class="mu" for="nm">Как вас зовут?</label><input class="pin" id="nm" maxlength="20" placeholder="Имя" autocomplete="given-name">
     <div class="mu">Аватар</div><div class="avs">${AVATARS.map(a=>`<button type="button" data-a="${a}" class="${a===av?'on':''}">${a}</button>`).join("")}</div>
     <button class="pbtn" id="go">Войти в игру ▶</button></div>`;
    let pick = av;
    P.querySelectorAll(".avs button").forEach(b => b.onclick = () => { pick = b.dataset.a; P.querySelectorAll(".avs button").forEach(x=>x.classList.toggle("on", x===b)); });
    $("#go").onclick = () => { const n = $("#nm").value.trim(); if (!n) { $("#nm").focus(); return; } ME.n = n.slice(0,20); ME.av = pick; saveMe(); NET.pub("p/"+ME.id, {n:ME.n, av:ME.av}); drawPhone(); };
    return;
  }
  const st = ME.st, R0 = ME.res || {};
  const head = `${phTop()}<div class="row" style="align-items:center;gap:12px"><span style="font-size:38px">${ME.av}</span><div style="flex:1"><h3>${esc(ME.n)}</h3><div class="mu mono" style="font-size:12px">${R0.rank?`место ${R0.rank} из ${R0.n} · ${fmt(R0.score||0)} очков`:"очки появятся после первого вопроса"}</div></div></div>`;
  if (!st) { P.innerHTML = head + `<div class="pcard center"><div class="bigemoji">📡</div><h3>Ждём ведущего…</h3><div class="mu">Экран презентации ещё не включён или нет связи.</div></div>`; return; }
  const s = SLIDES[st.slide] || SLIDES[0];
  let body = "";
  if (s.live === "poll") {
    const my = ME.sent["poll"];
    body = `<div class="pcard"><h3>${POLL.q}</h3>${my!=null?`<div class="ok">Голос принят ✅ (${esc(POLL.o[my])})</div>`:""}<div class="pq">${POLL.o.map((o,i)=>`<button type="button" data-v="${i}" style="background:${i===my?'linear-gradient(135deg,var(--holo),#2bb7ff);color:#001018':'rgba(79,243,255,.08)'};border:1px solid var(--line)">${o}</button>`).join("")}</div></div>`;
  } else if (s.quiz) {
    const q = QUIZ[s.quiz], key = s.quiz, mine = ME.sent[key];
    if (st.sub === "") body = `<div class="pcard center"><div class="bigemoji">🧠</div><h3>Приготовьтесь!</h3><div class="mu">Вопрос появится через секунду. Быстрый правильный ответ = больше очков.</div></div>`;
    else if (st.sub === "q") {
      if (mine != null) body = `<div class="pcard center"><div class="bigemoji">🔒</div><h3>Ответ принят: ${LETTERS[mine]}</h3><div class="mu">Смотрите на экран 👀</div></div>`;
      else body = `<div class="pcard"><div class="pbar"><i id="qbar" style="width:100%"></i></div><h3>${q.q}</h3><div class="pq">${q.o.map((o,i)=>`<button type="button" class="q${LETTERS[i]}" data-c="${i}"><span class="L">${LETTERS[i]}</span>${o}</button>`).join("")}</div></div>`;
    } else {
      const L = R0.last; const ok = L && L.ok;
      body = `<div class="pcard center" style="border-color:${ok?'var(--ok)':'var(--bad)'}"><div class="bigemoji">${ok?"🎉":mine==null?"⏰":"😅"}</div><h2 class="${ok?'ok':'bad'}">${ok?"Верно!":mine==null?"Время вышло":"Мимо"}</h2>${ok?`<div class="big gold" style="font-size:40px">+${L.pts}</div>`:""}<div class="mu">Правильный ответ: <b>${LETTERS[q.a]} — ${q.o[q.a]}</b></div></div>`;
    }
  } else if (s.id === "gsetup") {
    const g = ME.gameLocal || {loc:"mahalla", price:8000}; const sentG = ME.sent["game"]; const locked = st.lock;
    const calc = gameCalc(g, 0, ME.id);
    body = `<div class="pcard"><div class="row" style="justify-content:space-between;align-items:center"><h3>🥟 Самса-Тайкун</h3><b class="mono" id="gleft"></b></div><div class="pbar"><i id="gbar" style="width:100%"></i></div>
      ${locked?`<div class="gold">Рынок закрыт. ${sentG?"Ваше решение принято ✅":"Вы не успели 😢"}</div>`:""}
      <div class="mu">1. Место</div>
      <div class="ploc">${Object.entries(LOCS).map(([k,l])=>`<button type="button" data-l="${k}" class="${g.loc===k?'on':''}" ${locked?"disabled":""}><span class="ic">${l.ic}</span><span><b>${l.nm}</b><small>FC ${mln(l.fc)} · поток ${l.tr}/день</small></span></button>`).join("")}</div>
      <div class="mu">2. Цена самсы: <b class="gold" id="pv">${fmt(g.price)}</b> сум</div>
      <input type="range" id="pr" min="5000" max="15000" step="500" value="${g.price}" style="width:100%;accent-color:#ffb547" ${locked?"disabled":""}>
      <div class="pstat"><div><small>ВАША ТБУ</small><b id="pb">${fmt(calc.bep)}</b> шт/мес</div><div><small>ПРОГНОЗ ПРОДАЖ</small><b id="pq">${fmt(calc.q)}</b> шт/мес</div><div style="grid-column:1/-1"><small>ПРОГНОЗ ПРИБЫЛИ (без событий)</small><b id="pp" class="${calc.profit>=0?'ok':'bad'}">${mln(calc.profit)}</b></div></div>
      ${locked?"":`<button class="pbtn" id="gsend">${sentG?"Обновить решение ✅":"Открыть самсахону 🚀"}</button>`}</div>`;
  } else if (s.id === "gevents" || s.id === "gresults") {
    const G = R0.game;
    body = G ? `<div class="pcard center"><div class="bigemoji">${G.profit>=0?"📈":"📉"}</div><div class="mu">${s.id==="gevents"?"Сейчас, после событий":"Итог месяца"}</div><div class="big ${G.profit>=0?'ok':'bad'}" style="font-size:40px">${G.profit>=0?"+":""}${mln(G.profit)}</div>
      <div class="pstat"><div><small>МЕСТО</small><b>${G.rank} / ${G.n}</b></div><div><small>${LOCS[G.loc].ic} ЦЕНА</small><b>${fmt(G.P)}</b></div><div><small>ПРОДАНО</small><b>${fmt(G.q)}</b></div><div><small>ТБУ</small><b>${isFinite(G.bep)?fmt(G.bep):"∞"}</b></div></div>
      ${G.fine?`<div class="bad">👮 Штраф СЭС −3 млн. Медкнижка, Карл!</div>`:""}<div class="mu">${G.q>=G.bep?"Вы прошли точку безубыточности ✅":"Не дотянули до точки безубыточности ❌"}</div></div>`
      : `<div class="pcard center"><div class="bigemoji">👀</div><h3>Смотрите на экран</h3><div class="mu">Вы не открыли самсахону в этом раунде.</div></div>`;
  } else if (s.id === "final" || s.id === "summary" || s.id === "close") {
    body = `<div class="pcard center"><div class="bigemoji">${R0.rank===1?"🏆":R0.rank<=3?"🥇":"🥟"}</div><h2>${R0.rank?`Ваше место: ${R0.rank} из ${R0.n}`:"Спасибо за участие!"}</h2><div class="big gold" style="font-size:36px">${fmt(R0.score||0)} очков</div><div class="mu">Формула дня: Q = FC ÷ (P − VC)</div></div>`;
  } else {
    body = `<div class="pcard center"><div class="bigemoji">👀</div><h3>Смотрите на экран</h3><div class="mu">Слайд ${st.slide+1} / ${SLIDES.length}: ${esc(s.nm)}</div></div>`;
  }
  P.innerHTML = head + body;
  // обработчики
  P.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { const v = +b.dataset.v; ME.sent["poll"] = v; saveMe(); NET.pub("a/"+ME.id+"/poll", {c:v}); navigator.vibrate?.(20); drawPhone(); });
  P.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
    const key = s.quiz; if (ME.sent[key] != null) return; const c = +b.dataset.c;
    const seen = ME.qSeen[key+st.t0] || Date.now(); ME.sent[key] = c; saveMe();
    NET.pub("a/"+ME.id+"/"+key, {c, ms: Date.now()-seen}); navigator.vibrate?.(40); drawPhone(); });
  if (s.id === "gsetup" && !st.lock) {
    const g = ME.gameLocal || (ME.gameLocal = {loc:"mahalla", price:8000});
    const upd = () => { const c = gameCalc(g, 0, ME.id); $("#pv").textContent = fmt(g.price); $("#pb").textContent = fmt(c.bep); $("#pq").textContent = fmt(c.q); const pp = $("#pp"); pp.textContent = mln(c.profit); pp.className = c.profit>=0?"ok":"bad"; };
    P.querySelectorAll("[data-l]").forEach(b => b.onclick = () => { g.loc = b.dataset.l; P.querySelectorAll("[data-l]").forEach(x=>x.classList.toggle("on", x===b)); upd(); saveMe(); });
    $("#pr").oninput = e => { g.price = +e.target.value; upd(); };
    $("#gsend").onclick = () => { ME.sent["game"] = 1; saveMe(); NET.pub("g/"+ME.id, {loc:g.loc, price:g.price}); navigator.vibrate?.([30,40,30]); $("#gsend").textContent = "Обновить решение ✅"; };
  }
  tickPhone();
}
function tickPhone(){
  const st = ME.st; if (!st) return; const s = SLIDES[st.slide];
  if (s.quiz && st.sub === "q") { const seen = ME.qSeen[s.quiz+st.t0] || Date.now(); const left = CFG.QUIZ_SEC - (Date.now()-seen)/1000; const b = $("#qbar"); if (b) b.style.width = clamp(left/CFG.QUIZ_SEC*100,0,100)+"%"; }
  if (s.id === "gsetup") { const left = CFG.GAME_SEC - (Date.now()-(ME.qSeen["g"+st.t0]||st.t0))/1000; const b = $("#gbar"), t = $("#gleft"); if (b) b.style.width = clamp(left/CFG.GAME_SEC*100,0,100)+"%"; if (t) t.textContent = st.lock ? "⛔" : Math.max(0,Math.ceil(left))+" с"; }
}

/* =========================================================================
   11) ВХОД
   ========================================================================= */
if (IS_HOST) startHost();
else if (ROOM) startPhone();
else {
  $("#landing").hidden = false;
  const inPreview = location.protocol === "about:" || location.href.startsWith("about:");
  $("#lHost").onclick = () => { if (inPreview) { $("#landing").hidden = true; startHost(); } else location.search = "?host=1"; };
  $("#lJoin").onclick = () => { const r = $("#lRoom").value.replace(/\D/g,""); if (r.length !== 4) { $("#lRoom").focus(); return; } if (inPreview) { ROOM = r; $("#landing").hidden = true; startPhone(); } else location.search = "?room=" + r; };
}
</script>
</body>
</html>
